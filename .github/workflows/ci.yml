name: build-and-test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # WinUI 3 / CsWin32 都需要 Windows；ubuntu-latest 上 Core 里的 P/Invoke 编译不过
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 文档一致性：SPEC 内嵌的清单/脚本全文 vs 真实文件、断言条数、悬空引用
      - name: Docs consistency
        shell: powershell
        run: .\tools\Verify-Docs.ps1

      # 引擎断言（124 条，xUnit）：这是唯一的硬门槛
      - name: Test (Core assertions)
        run: dotnet test tests/BatchRename.Core.Tests/BatchRename.Core.Tests.csproj -c Release

      # App 是 WinUI 3，需要 Windows App SDK；只验证能编过，不跑 UI
      - name: Build (WinUI app)
        run: dotnet build src/BatchRename.App/BatchRename.App.csproj -c Release

      # 控制台入口也编一遍：它链接 Core 源码，能提前抓到"Core 混进 WinUI 依赖"的回归
      - name: Build (console harness)
        run: dotnet build src/BatchRename.ShellTest/BatchRename.ShellTest.csproj -c Release

      # 原生 Shell 扩展（C++/WRL）必须一起编：改 dllmain/ExplorerCommand 时
      # 前面三步都不会红，问题要等装到机器上才发现。
      # 失败时把关键行以 ::error:: 注解抛出——日志接口要鉴权，注解接口公开可读。
      - name: Build (native shell extension)
        shell: powershell
        run: |
          # IMPORTANT: keep this script ASCII-only.
          # GitHub writes the step body to a .ps1 without a BOM, and Windows PowerShell 5.1
          # decodes that as ANSI (GBK on CJK systems). Non-ASCII literals then turn into
          # mojibake and break the parser before the first statement runs.
          $ErrorActionPreference = 'Stop'
          try {
            $proj = 'src\BatchRename.Shell\BatchRename.Shell.vcxproj'
            $common = @($proj, '/p:Configuration=Release', '/p:Platform=x64', '/m', '/v:m')

            # msbuild is not necessarily on PATH on the runner; locate the one shipped with VS.
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) { throw "vswhere not found: $vswhere" }

            $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsRoot) { $vsRoot = & $vswhere -latest -products * -property installationPath }
            if (-not $vsRoot) { throw 'No Visual Studio installation found' }

            $msb = Join-Path $vsRoot 'MSBuild\Current\Bin\MSBuild.exe'
            if (-not (Test-Path $msb)) { throw "MSBuild not found: $msb" }

            $toolset = (& $msb @common '-getProperty:PlatformToolset' 2>&1 | Select-Object -Last 1)
            Write-Host "msbuild=$msb"
            Write-Host "toolset=$toolset"

            $log = Join-Path $env:RUNNER_TEMP 'msbuild.log'
            & $msb @common 2>&1 | Tee-Object -FilePath $log | Select-Object -Last 80

            # Belt and braces: if the project still resolves a toolset this VS does not ship,
            # retry once with the VS2022 toolset instead of failing the job.
            if ($LASTEXITCODE -ne 0 -and (Select-String -Path $log -Pattern 'MSB8020' -Quiet)) {
              Write-Host 'Retrying with /p:PlatformToolset=v143'
              & $msb @common '/p:PlatformToolset=v143' 2>&1 | Tee-Object -FilePath $log -Append | Select-Object -Last 80
            }

            if ($LASTEXITCODE -eq 0) { exit 0 }

            Write-Host "::error::native shell build failed (toolset=$toolset)"
            Get-Content $log |
              Where-Object { $_ -match 'error|MSB\d{4}|LNK\d{4}|C\d{4}' } |
              Select-Object -Unique -First 8 |
              ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          catch {
            Write-Host "::error::$_"
            exit 1
          }
