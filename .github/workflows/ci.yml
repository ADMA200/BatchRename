name: build-and-test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # WinUI 3 / CsWin32 都需要 Windows；ubuntu-latest 上 Core 里的 P/Invoke 编译不过
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 文档一致性：SPEC 内嵌的清单/脚本全文 vs 真实文件、断言条数、悬空引用
      - name: Docs consistency
        shell: powershell
        run: .\tools\Verify-Docs.ps1

      # 引擎断言（124 条，xUnit）：这是唯一的硬门槛
      - name: Test (Core assertions)
        run: dotnet test tests/BatchRename.Core.Tests/BatchRename.Core.Tests.csproj -c Release

      # App 是 WinUI 3，需要 Windows App SDK；只验证能编过，不跑 UI
      - name: Build (WinUI app)
        run: dotnet build src/BatchRename.App/BatchRename.App.csproj -c Release

      # 控制台入口也编一遍：它链接 Core 源码，能提前抓到"Core 混进 WinUI 依赖"的回归
      - name: Build (console harness)
        run: dotnet build src/BatchRename.ShellTest/BatchRename.ShellTest.csproj -c Release

      # 原生 Shell 扩展（C++/WRL）必须一起编：改 dllmain/ExplorerCommand 时
      # 前面三步都不会红，问题要等装到机器上才发现。
      # 失败时把关键行以 ::error:: 注解抛出——日志接口要鉴权，注解接口公开可读。
      - name: Build (native shell extension)
        shell: powershell
        run: |
          # windows-latest 上 msbuild 不一定在 PATH 里（VS2022 镜像只有在开发者命令行环境下才有），
          # 所以用 vswhere 定位 VS 自带的 MSBuild.exe。失败时把关键行抛成 ::error:: 注解：
          # 日志接口要鉴权，注解接口公开可读。
          $ErrorActionPreference = 'Stop'
          try {
            $proj = 'src\BatchRename.Shell\BatchRename.Shell.vcxproj'
            $common = @($proj, '/p:Configuration=Release', '/p:Platform=x64', '/m', '/v:m')

            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) { throw "找不到 vswhere: $vswhere" }

            $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsRoot) { throw "没有安装 C++ 生成工具（VC.Tools.x86.x64）" }

            $msb = Join-Path $vsRoot 'MSBuild\Current\Bin\MSBuild.exe'
            if (-not (Test-Path $msb)) { throw "找不到 MSBuild: $msb" }

            $toolset = (& $msb @common '-getProperty:PlatformToolset' 2>&1 | Select-Object -Last 1)
            Write-Host "msbuild=$msb"
            Write-Host "toolset=$toolset"

            $log = Join-Path $env:RUNNER_TEMP 'msbuild.log'
            & $msb @common 2>&1 | Tee-Object -FilePath $log | Select-Object -Last 60
            if ($LASTEXITCODE -eq 0) { exit 0 }

            Write-Host "::error::msbuild 失败（toolset=$toolset）"
            Get-Content $log |
              Where-Object { $_ -match 'error|MSB\d{4}|LNK\d{4}|C\d{4}' } |
              Select-Object -Unique -First 6 |
              ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          catch {
            Write-Host "::error::$_"
            exit 1
          }
